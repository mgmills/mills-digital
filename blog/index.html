  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

      color: #2c3e50;

      line-height: 1.6;
    }
    .topbar {
      background: #1a1a1a;
      color: #ffffff;
      padding: 1rem 0;
      border-bottom: 3px solid #2874a6;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    .topbar .wrap { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.5rem; font-weight: 700; color: #ffffff; text-decoration: none; }
    .nav { display: flex; gap: 2rem; }
    .nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: background 0.3s;
    }
    .nav a:hover, .nav a.active { background: #2874a6; }
    .page-header {
      background: linear-gradient(135deg, #1a1a1a 0%, #34495e 100%);

      padding: 3rem 2rem;

    .page-header p { color: #bdc3c7; font-size: 1.05rem; }
    .content { padding: 3rem 2rem; }
    .post-list { max-width: 760px; }
    .post-card {
      border-bottom: 1px solid #e1e8ed;
      padding: 2rem 0;
    }
    .post-card:last-child { border-bottom: none; }
    .post-meta { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 0.5rem; }
    .post-meta .tag {
      background: #eef2f7;
      color: #2874a6;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 500;
      margin-left: 0.5rem;
    }
    .post-card h2 { font-size: 1.45rem; margin-bottom: 0.75rem; }
    .post-card h2 a { color: #1a1a1a; text-decoration: none; }
    .post-card h2 a:hover { color: #2874a6; }
    .post-card p { color: #555; font-size: 0.98rem; margin-bottom: 1rem; }
    .read-more {
      color: #2874a6;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .read-more:hover { text-decoration: underline; }
    .footer {
      background: #1a1a1a;
      color: #ecf0f1;
      padding: 2rem;
      text-align: center;
      font-size: 0.9rem;
      margin-top: 4rem;
    }
    .footer a { color: #2874a6; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      .page-header h1 { font-size: 1.75rem; }
      .nav { gap: 0.75rem; }
